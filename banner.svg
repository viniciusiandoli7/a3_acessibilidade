<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Alerta Visual</title>
  <desc id="d">Banner do projeto Alerta Visual: um sino com ondas sonoras que se transformam em luzes coloridas.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="0.55" stop-color="#12234a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#fundo)"/>
  <rect width="1200" height="340" rx="24" fill="url(#brilho)"/>

  <!-- sino -->
  <g transform="translate(205 170)" fill="none" stroke="#e0ecff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-52 18c0-60 20-92 52-92s52 32 52 92c0 40 18 54 18 54h-140s18-14 18-54z"/>
    <path d="M-22 90a24 24 0 0 0 44 0"/>
    <path d="M0 -92v-14"/>
    <path d="M-86 -40c-14 14-20 34-20 56" stroke="#93c5fd" stroke-width="7"/>
    <path d="M86 -40c14 14 20 34 20 56" stroke="#93c5fd" stroke-width="7"/>
    <path d="M-112 -62c-24 22-34 52-34 86" stroke="#60a5fa" stroke-width="6" opacity=".7"/>
    <path d="M112 -62c24 22 34 52 34 86" stroke="#60a5fa" stroke-width="6" opacity=".7"/>
  </g>

  <!-- do som para a luz -->
  <g fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M388 160h26"/>
    <path d="M424 160h12"/>
    <path d="M446 160h6"/>
  </g>

  <!-- LEDs -->
  <g>
    <circle cx="496" cy="150" r="34" fill="#3b82f6" filter="url(#halo)" opacity=".8"/>
    <circle cx="496" cy="150" r="26" fill="#3b82f6"/>
    <circle cx="586" cy="150" r="34" fill="#f59e0b" filter="url(#halo)" opacity=".8"/>
    <circle cx="586" cy="150" r="26" fill="#f59e0b"/>
    <circle cx="676" cy="150" r="34" fill="#ef4444" filter="url(#halo)" opacity=".8"/>
    <circle cx="676" cy="150" r="26" fill="#ef4444"/>
  </g>

  <!-- textos -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="470" y="92" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="4">PROJETO ACADÊMICO · ACESSIBILIDADE</text>
    <text x="470" y="262" font-size="64" font-weight="800" fill="#ffffff">Alerta Visual</text>
    <text x="472" y="304" font-size="24" fill="#cbd5e1">Sons importantes da casa, vistos e sentidos.</text>
  </g>
</svg>
